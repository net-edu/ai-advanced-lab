<script type="text/plain" data-path="CLAUDE.md">
# NVIDIA 적정가치 판단 프로젝트 - 분석 표준 (stage5: loop 기준=암묵지 형식지화)

이 프로젝트는 **한 종목(NVIDIA)이 저평가/적정/고평가인지 종합 판단**하는 리포트를 쓰는
실습용 harness다. 한 과제 안에서 정형 데이터(재무제표→지표)와 비정형 데이터(리포트·뉴스→
정성 판단)를 모두 처리하고 종합한다. stage5은 종합 판정을 좌우하는 미래 예상 가정(목표
주가배수·성장률)의 정상 범위를 golden-reports/에서 직접 역산해 형식지화하는 단계다.

## 산출물 위치
- 리포트는 반드시 reports/fair-value.md 한 파일에 쓴다.

## 리포트 필수 섹션 (5개, 순서 유지)
1. ## 종목 개요 - 종목명·코드·기준일·현재 주가·시가총액
2. ## 정량 분석 (정형) - 지표를 계산식과 함께 표로. data/financials.json이 원천.
3. ## 정성 분석 (비정형) - raw/의 리포트·뉴스에서 긍정 요인/우려 요인을 균형 있게.
4. ## 종합 판정 - 정량 신호 + 정성 판단을 종합해 저평가/적정/고평가 중 하나 + 근거.
5. ## 결론 - 투자의견 + 판정을 좌우한 미래 예상 가정을 명시 + 유의점.
맨 끝에 ## 출처 섹션.

## 정량 지표 규칙 (형식 고정 - 뒤 단계에서 이 값을 재계산해 검증)
| 지표 | 계산식 | 예(NVIDIA FY2026) |
| 주당순이익(EPS) | 희석주당이익(재무제표) | $4.90 |
| 주가배수(PER) | 주가 ÷ 주당순이익 | 44.3 |
| 매출 증가율 | (당기매출−전기매출) ÷ 전기매출 | 65.5% |
| 영업이익률 | 영업이익 ÷ 매출액 | 60.4% |
| 순이익 증가율 | (당기순이익−전기순이익) ÷ 전기순이익 | 64.7% |
- 모든 정량 수치엔 인라인 출처: `... 순이익 $120.1B[출처: data/financials.json]`.

## 미래 예상 가정 형식 (stage5 - 검증 스크립트가 이 형식을 읽는다)
## 결론 아래 `### 판정 근거 미래 예상 가정` 소제목에 아래 2줄을 이 형식 그대로 넣는다:
    - 목표 주가배수: 29.0배
    - 장기 이익 성장률: 27.5%
- 두 값은 assumptions-bands.md의 적정 범위 안(목표 주가배수 18~35배, 성장률 20~44%)에서 정한다.
- 범위를 벗어나려면 결론에 `적정범위 밖 근거: <근거>` 마커를 단다(근거의 질은 subagent가 판정).

## 채점·검증 기준 (오라클 = 정형 hook + 비정형 subagent 두 겹)
- 정형(결정론) hook scripts/validate_fair_value.py: 형식·정량 지표 재계산 + 미래 예상 가정이
  적정 범위 안인지 강제(exit 2). 범위 밖인데 마커가 없으면 실패.
- 비정형(주관) subagent .claude/agents/fair-value-reviewer.md: 정성 분석 균형·근거·종합 일관성
  + 범위 밖 근거의 설득력을 채점(PASS≥9/12).
- 정형(hook)과 비정형(subagent)이 한 파이프라인에 공존한다.

## 워크플로우 (loop)
1. golden-reports/ 5건 → assumptions-bands.md 범위가 어떻게 역산됐는지 확인(형식지화 이해)
2. data/financials.json + raw/ 읽기 → /fair-value-report NVIDIA → reports/fair-value.md
3. fair-value-reviewer subagent로 정성·종합·범위밖 근거 채점
4. 세션 종료 시 Stop hook이 형식·지표·미래 예상 가정 범위 검증 → 반영해 재시도
5. hook 통과 + 리뷰어 PASS 될 때까지 반복
</script>

   reports/fair-value.md를 쓴다.
5. 소스별 수치가 다르면 원본(financials.json) 기준으로 재조정하고 차이를 명시한다.

<script type="text/plain" data-path="assumptions-bands.md">
# 판정 가정 적정 범위 - golden-reports/에서 역산 (암묵지 형식지화, 이 stage의 페이로드)

golden-reports/ 5개 리포트가 NVIDIA에 대해 쓴 미래 예상 가정(목표 주가배수·성장률)을
대조해 정상 범위를 직접 역산했다. stage4의 지표 계산은 이미 공식이 있던 것을 옮겨 담은
것이지만, 이 범위는 아무도 정해주지 않은 것을 내가 golden에서 역산해 형식지화한 것이다.

## 1. 골든 리포트가 쓴 가정 (관측)
| 리포트 | 목표 주가배수 | 장기 성장률 | 스탠스 |
| 05 학술 보수적 계산모델 | 18.1배(역산) | 20.0%(추정) | 프리미엄 소멸·성숙기 진입 |
| 02 SimplyWall 계산모델(이후) | 28.93배 | 37.36% | 미세 하향 재조정 |
| 01 SimplyWall 계산모델(이전) | 29.02배 | 37.36% | AI 고성장 지속, 배수는 정상화 |
| 03 애널리스트 평균 | 29.0배 | 27.5% | 시장 의견 중심값 |
| 04 최고 낙관 시나리오 | 34.2배 | 43.87% | 프리미엄 유지, AI 슈퍼사이클 |

## 2. 역산한 정상 범위 (채택값)
| 가정 | 관측 범위 | 채택 범위 |
| 목표 주가배수 | 18.1 ~ 34.2배 | **18.0 ~ 35.0배** |
| 장기 성장률 | 20.0 ~ 43.87% | **20.0 ~ 44.0%** |
- 채택값을 관측 최댓값·최솟값에 딱 맞추지 않고 소폭 여유를 둔 것 자체가 작은 판단이다.

## 3. 함정 (형식지화는 판단을 없애는 게 아니다)
- 범위 밖 가정도 정당한 근거가 있으면 유효하다 - 범위는 판단을 없애는 게 아니라 기본값을 준다.
- 그래서 오라클은 두 겹이다: hook이 범위를 기본값으로 강제하고(범위 밖이면 근거 요구),
  fair-value-reviewer subagent가 그 근거가 설득력 있는지 판정한다.

## 4. REVEAL
- stage4의 지표 계산 = 이미 공식이 있던 것을 hook에 옮겨 담음.
- stage5의 가정 범위 = golden 리포트에서 직접 역산해 형식지화.
- 둘 다 "판정 기준을 형식지화"라는 같은 종류의 작업이고, 차이는 남이 해놨나 / 내가 해야 하나뿐이다.

#!/usr/bin/env python3
"""stage5 적정가치 리포트 검증기 - 정형(결정론) 파트. Claude Code Stop hook으로 실행된다.
reports/fair-value.md를 검사해:
  - 필수 섹션 5개 + '## 출처' + 인라인 출처 표기 + 플레이스홀더 없음 (형식)
  - data/financials.json(SEC 10-K)으로 정량 지표 5개를 재계산해 리포트 값과 대조
  - '## 종합 판정'에 저평가/적정(중립)/고평가 중 하나가 있는지
  - ★[stage5] '### 판정 근거 미래 예상 가정'의 목표 주가배수·장기 이익 성장률이
    data/assumptions.json 적정 범위 안인지. 범위 밖이면 '적정범위 밖 근거:' 마커 필수.
하나라도 실패하면 사유를 stderr로 내고 exit 2 → Claude가 종료를 못 하고 고치게 된다."""
REQUIRED_SECTIONS = ["종목 개요","정량 분석","정성 분석","종합 판정","결론"]
MIN_INLINE_CITATIONS = 5
OUTOFBAND_MARKER = "적정범위 밖 근거:"

def compute_metrics(fin):
    c, p, mkt = fin["current"], fin["prior"], fin["시장"]
    eps = fin["주당순이익_달러"]["FY2026"]
    per = mkt["주가"] / eps
    revenue_growth = (c["매출액"] - p["매출액"]) / p["매출액"] * 100
    opm = c["영업이익"] / c["매출액"] * 100
    ni_yoy = (c["당기순이익"] - p["당기순이익"]) / p["당기순이익"] * 100
    return {"주당순이익":f"{eps:.2f}","주가배수":f"{per:.1f}","매출증가율":f"{revenue_growth:.1f}",
            "영업이익률":f"{opm:.1f}","순이익증가율":f"{ni_yoy:.1f}"}

def validate(path):
    text = open(path, encoding="utf-8").read()
    failures = []
    # 1) 필수 섹션 / '## 출처'  2) 인라인 출처 최소 5개  3) 플레이스홀더 없음
    # 4) 정량 지표 5개 재계산 대조 (financials.json)
    for name, val in compute_metrics(fin).items():
        if val not in text:
            failures.append(f"{name} 값 불일치 - 재계산값 '{val}'이 리포트에 없음")
    # 5) '## 종합 판정'에 판정어(저평가/적정/고평가) 존재
    # 6) [stage5] 미래 예상 가정이 적정 범위 안인지 (assumptions.json 밴드와 대조)
    target_pe = extract_assumption(text, "목표 주가배수")
    growth    = extract_assumption(text, "장기 이익 성장률")
    out_of_band = not (pe_band["min"] <= target_pe <= pe_band["max"]) \
               or not (gr_band["min"] <= growth <= gr_band["max"])
    if out_of_band and OUTOFBAND_MARKER not in text:
        failures.append("미래 예상 가정이 적정 범위를 벗어났는데 '적정범위 밖 근거:' 마커가 없음")
    return failures

# main: failures 있으면 stderr 출력 + sys.exit(2) / 없으면 sys.exit(0)
#   (정성 분석 품질·범위 밖 근거의 설득력은 fair-value-reviewer subagent가 채점)
</script>

## 무엇을 채점하나 (항목당 0~4점)

/* ── 사이징 3원칙 (고정 px 목표값 없음 - 텍스트 측정으로 계산) ──
   ① 노드 안 텍스트는 반드시 다 들어간다 → 오프스크린 canvas로 라벨을 실제 측정해 노드 w/h 계산.
   ② 엣지 라벨 폰트 = 노드 라벨 폰트 → 단 하나의 FONT_SIZE 변수로 공유.
   ③ 노드 폭 : 그 노드를 잇는 화살표 최소 길이 = 1:1 → 컬럼 간격을 노드 폭 측정값으로 유도.
      텍스트 있는 엣지는 라벨이 다 들어갈 만큼만 더 넓힌다. */
const FONT_SIZE = 22;                         // 노드·엣지 라벨 공유 폰트(20~26 범위에서 이 프로젝트에 맞춰 선택)
function measure(text, fontPx, weight){
  const ctx = measure._ctx || (measure._ctx = document.createElement('canvas').getContext('2d'));
  ctx.font = `${weight||700} ${fontPx}px -apple-system,"Malgun Gothic",sans-serif`;
  return Math.max(...String(text).split('\n').map(line => ctx.measureText(line).width));
}
const PAD_X = 26, PAD_Y = 20, LINE_H = FONT_SIZE * 1.4;
const DIAMOND_CATS = new Set(['formal','informal']);   // 다이아몬드로 그리는 카테고리
/* ① 각 노드 라벨을 측정해 폭/높이를 정한다(고정값 아님). 다이아몬드는 대각선 여유계수 1.4. */
NODES.forEach(n=>{
  const label = (ACTOR_ICON[n.actor]||'') + ' ' + n.label;
  const lines = label.split('\n');
  const w = Math.max(...lines.map(l => measure(l, FONT_SIZE))) + PAD_X*2;
  const h = lines.length*LINE_H + PAD_Y*2;
  const k = DIAMOND_CATS.has(n.category) ? 1.4 : 1;
  n.w = Math.round(w*k); n.h = Math.round(h*k);
});

/* ③ 컬럼 간 x간격: 인접 노드 폭 평균(=화살표 최소 길이 ≈ 노드 폭, 1:1)을 기본으로,
      그 사이 엣지에 라벨이 있으면 라벨 폭(동일 FONT_SIZE로 측정)만큼 더 벌린다. */
const NODE = Object.fromEntries(NODES.map(n=>[n.id,n]));
const colWidth = {};
NODES.forEach(n=>{ colWidth[n.col] = Math.max(colWidth[n.col]||0, n.w); });
const maxCol = Math.max(...NODES.map(n=>n.col));
const xOfCol = {0:0};
for(let c=1;c<=maxCol;c++){
  let gap = (colWidth[c-1] + colWidth[c]) / 2;                 // 1:1 기준(화살표 길이 ≈ 노드 폭)
  EDGES.forEach(e=>{
    const a=NODE[e.from], b=NODE[e.to];
    if(a && b && a.col===c-1 && b.col===c && e.label){
      gap = Math.max(gap, measure(e.label, FONT_SIZE, 700) + 48);  // 라벨이 더 넓으면 그만큼 벌림
    }
  });
  xOfCol[c] = xOfCol[c-1] + colWidth[c-1]/2 + gap + colWidth[c]/2;
}
/* 분기축(row) y간격: 노드 높이 측정값 기준(1:1 규칙은 진행축만 대상 - 세로는 높이+여백). */
const rowHeight = {};
NODES.forEach(n=>{ rowHeight[n.row] = Math.max(rowHeight[n.row]||0, n.h); });
const maxRowH = Math.max(...Object.values(rowHeight));
const V_GAP = 56;
const rowPitch = maxRowH + V_GAP;              // 루프백 곡률도 이 값에서 유도(고정 px 아님)

const styleCat = Object.keys(CAT).map(k=>({
  selector:`node[category="${k}"]`, style:{ 'border-color':CAT[k].c, 'background-color':CAT[k].bg }
}));
const elements = [
  ...NODES.map(n=>({ data:{ id:n.id, label:(ACTOR_ICON[n.actor]||'')+' '+n.label,
      category:n.category, actor:n.actor, w:n.w, h:n.h },
      position:{ x:xOfCol[n.col], y:n.row*rowPitch } })),
  ...EDGES.map((e,i)=>({ data:{ id:'e'+i, source:e.from, target:e.to, label:e.label||'', kind:e.kind||'' } })),
];

const ARROW = Math.max(1.4, FONT_SIZE/16);     // 화살촉도 FONT_SIZE에 비례(고정 배율 상수 금지)
const cy = cytoscape({
  container: document.getElementById('flow'),
  elements,
  layout:{ name:'preset' },
  wheelSensitivity:0.2,
  style:[
    /* 노드 크기는 위에서 측정해 data(w)/data(h)에 넣었다 - 여기서 고정 width/height를 주지 않는다. */
    { selector:'node', style:{
      'label':'data(label)','text-valign':'center','text-halign':'center','text-wrap':'wrap',
      'text-max-width':'data(w)','width':'data(w)','height':'data(h)',
      'font-size':FONT_SIZE,'color':'#1a1d21','font-weight':700,
      'background-color':'#fff','border-width':3,'border-color':'#c9c9c9','shape':'round-rectangle',
      'text-outline-width':0 } },
    ...styleCat,
    { selector:'node[category="formal"]',  style:{ 'shape':'diamond' } },
    { selector:'node[category="informal"]',style:{ 'shape':'diamond' } },
    { selector:'node[category="end"]',     style:{ 'shape':'round-rectangle','border-width':4 } },
    { selector:'node[actor="human"]', style:{ 'border-style':'dashed' } },
    { selector:'node.dim',   style:{ 'opacity':0.28 } },
    { selector:'edge.dim',   style:{ 'opacity':0.12 } },
    { selector:'node.active', style:{ 'border-color':'#d97757','border-width':6,'background-color':'#fff3ee',
      'overlay-color':'#d97757','overlay-opacity':0.18,'overlay-padding':14,'z-index':50 } },
    { selector:'node.picked', style:{ 'border-color':'#2f6df0','border-width':6,'border-style':'double' } },
    /* ② 엣지 라벨 font-size = FONT_SIZE(노드와 동일). 화살촉도 FONT_SIZE 비례. */
    { selector:'edge', style:{
      'width':3,'line-color':'#b7bcc4','target-arrow-color':'#b7bcc4','target-arrow-shape':'triangle',
      'arrow-scale':ARROW,'curve-style':'bezier','label':'data(label)','font-size':FONT_SIZE,'color':'#3a4048',
      'font-weight':700,'text-wrap':'wrap','text-max-width':240,
      'text-background-color':'#fff','text-background-opacity':1,'text-background-padding':5,
      'text-rotation':'none','z-index':30 } },
    { selector:'edge[kind="loopback"]', style:{ 'line-style':'dashed','line-color':'#e0a07a',
      'target-arrow-color':'#e0a07a','curve-style':'unbundled-bezier',
      'control-point-distances':[-rowPitch*1.5],'control-point-weights':[0.5],'color':'#b5602f','z-index':32 } },
    /* 세 루프백(HOOK→WRITE=e8, BAND→WRITE=e10, REVIEW→WRITE=e12)이 WRITE로 수렴한다.
       곡률(control-point-distances)을 행 높이(rowPitch)에서 유도하고, 부호·가중치를 서로 달리해
       세 라벨이 WRITE 앞에서 겹치지 않게 위/멀리위/아래로 분산한다. */
    { selector:'edge#e8',  style:{ 'control-point-distances':[-rowPitch*1.35],'control-point-weights':[0.30] } }, // HOOK→WRITE : 위쪽 가까이
    { selector:'edge#e10', style:{ 'control-point-distances':[-rowPitch*2.6], 'control-point-weights':[0.5]  } }, // BAND→WRITE : 위쪽 멀리(더 긴 엣지)
    { selector:'edge#e12', style:{ 'control-point-distances':[ rowPitch*1.35],'control-point-weights':[0.30] } }, // REVIEW→WRITE: 아래쪽 가까이
    { selector:'edge.flow', style:{ 'line-color':'#d97757','target-arrow-color':'#d97757','width':5,
      'line-style':'dashed','line-dash-pattern':[12,7],'z-index':60,'opacity':1 } },
  ],
});

/* ============================ 상태 & 렌더 ============================ */
let stepIdx = 0, selectedNode = null, playing = false, awaitingGate = false, timer = null, rafId = null;
/* viewZoom = 화면 배율의 단일 소스. init·전체보기·사용자 휠에서만 바뀌고, 스텝 전환(focusNodes)은
   이 값을 유지한 채 팬만 한다 - 재생 중에도 사용자가 정한 배율이 초기화되지 않게. */
let viewZoom = 1.1, animatingView = false;
cy.on('zoom', ()=>{ if(!animatingView) viewZoom = cy.zoom(); });

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 범례 */
(function legend(){
  const el = document.getElementById('legend');
  let h = '<h4>카테고리</h4>';
  Object.keys(CAT).forEach(k=>{
    h += `<div class="row"><span class="dot" style="background:${CAT[k].bg};border-color:${CAT[k].c}"></span>${CAT[k].name}</div>`;
  });
  h += '<div class="sep"></div><h4>실행 주체</h4>';
  h += '<div class="row">👤 사람 · 🤖 AI</div>';
  h += '<div class="row" style="color:#5b6472">(사람=점선 테두리)</div>';
  h += '<div class="sep"></div><h4>엣지</h4>';
  h += '<div class="row">→ 진행</div>';
  h += '<div class="row" style="color:#b5602f">⤴ 루프백(점선·재시도)</div>';
  h += '<div class="row" style="color:#d97757">━ 주황 = 지금 지나간 경로</div>';
  el.innerHTML = h;
})();

/* 트리 */
function renderTree(activeFiles, touchedFiles){
  const el = document.getElementById('tree');
  el.innerHTML = TREE.map(t=>{
    const pad = '  '.repeat(t.depth);
    if(t.kind==='dir'){ return `<div class="tnode dir">${pad}${esc(t.name)}</div>`; }
    const isActive = activeFiles.has(t.path);
    const isTouched = touchedFiles.has(t.path);
    let cls = 'tnode file'; if(isActive) cls+=' active'; else if(isTouched) cls+=' touched';
    let badge = '';
    if(isActive){ const a = activeFiles.get(t.path);
      const bc = a==='write'?'b-write':a==='run'?'b-run':'b-read';
      const bt = a==='write'?'쓰기':a==='run'?'실행':'읽기';
      badge = `<span class="badge ${bc}">${bt}</span>`; }
    return `<div class="tnode ${cls}" data-path="${esc(t.path)}">${pad}${esc(t.name)}${badge}</div>`;
  }).join('');
  el.querySelectorAll('.tnode.file').forEach(n=>{
    n.addEventListener('click',()=>{ const p=n.getAttribute('data-path'); if(p) showFiles([{path:p,action:'read'}]); });
  });
}

/* 뷰어 (탭 여러 파일) */
let viewerFiles = [], viewerActive = 0;
function showFiles(files){
  viewerFiles = files.filter(f=>f.path); viewerActive = 0;
  renderViewer();
}
function renderViewer(){
  const tabs = document.getElementById('vtabs');
  const vpath = document.getElementById('vpath');
  const body = document.getElementById('viewerBody');
  if(!viewerFiles.length){ tabs.innerHTML=''; vpath.textContent='파일을 선택하세요'; body.textContent='노드를 클릭하면 파일 원문이 표시됩니다.'; return; }
  tabs.innerHTML = viewerFiles.map((f,i)=>{
    const name = f.path.split('/').pop();
    return `<button class="${i===viewerActive?'on':''}" data-i="${i}" title="${esc(f.path)}">${esc(name)}</button>`;
  }).join('');
  tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ viewerActive=+b.getAttribute('data-i'); renderViewer(); }));
  const f = viewerFiles[viewerActive];
  vpath.textContent = f.path + (f.action?`  ·  ${f.action==='write'?'쓰기':f.action==='run'?'실행':'읽기'}`:'');
  body.textContent = FILES[f.path] || '(원문 미임베드)';
}

/* context 누적 */
function renderCtx(){
  const el = document.getElementById('ctxList');
  let items = [];
  for(let i=0;i<=stepIdx;i++){ (STEPS[i].ctxAdd||[]).forEach(c=>items.push({...c, step:i})); }
  el.innerHTML = items.map((c,idx)=>{
    const cc = CAT[c.cat]||{c:'#888',bg:'#eee',name:c.cat};
    const recent = idx===items.length-1;
    return `<div class="ctxItem ${recent?'recent':''}" style="border-left-color:${cc.c};background:${cc.bg}">
      <span class="k" style="color:${cc.c}">${esc(cc.name)}</span>${esc(c.label)}</div>`;
  }).join('');
  document.getElementById('ctxCount').textContent = `지금까지 ${items.length}개 항목이 컨텍스트에 쌓임`;
  el.scrollTop = el.scrollHeight;
}

/* 상세 밴드 */
function renderDetail(){
  const el = document.getElementById('detail');
  const step = STEPS[stepIdx];
  let node = null;
  if(selectedNode) node = NODES.find(n=>n.id===selectedNode);
  else if(step.activeNodes.length===1) node = NODES.find(n=>n.id===step.activeNodes[0]);
  if(node){
    el.className='';
    const pill = `<span class="pill ${node.actor}">${ACTOR_ICON[node.actor]} ${node.actor==='human'?'사람':'AI'}</span>`;
    el.innerHTML = `<div class="note" style="color:#b5602f">${esc(step.note||'')}</div>
      <div class="title">${esc(node.label.replace(/\n/g,' '))}${pill}</div>
      <div class="desc">${esc(node.desc)}</div>
      <div class="why">💡 ${esc(node.why)}</div>`;
  } else {
    // 병렬(활성 여럿) or 선택없음: note + KEY_INSIGHT
    el.className='keyinsight';
    el.innerHTML = `<div class="note" style="color:#b5602f">${esc(step.note||'')}</div>
      <div class="kihead">핵심 통찰 (KEY INSIGHT)</div>
      <div class="desc">${esc(KEY_INSIGHT)}</div>`;
  }
}

/* 엣지 흐름 애니메이션 */
function animateEdge(fromId,toId){
  cy.edges('.flow').removeClass('flow'); if(rafId) cancelAnimationFrame(rafId);
  let e = cy.edges(`[source="${fromId}"][target="${toId}"]`);
  if(!e.length) e = cy.edges(`[source="${toId}"][target="${fromId}"]`);
  if(!e.length) return;
  e.addClass('flow');
  let off = 0;
  const tick=()=>{ off=(off-2)%160; e.style('line-dash-offset',off); rafId=requestAnimationFrame(tick); };
  tick();
}

/* 포커스: 활성 노드 살짝 왼쪽 센터링 */
function focusNodes(ids){
  const eles = cy.collection(ids.map(id=>cy.$('#'+id)));
  if(!eles.length) return;
  animatingView = true;
  cy.resize();                               // 컨테이너 크기를 매번 최신화(플렉스 레이아웃 지연 시 센터링 오차 방지)
  cy.zoom(viewZoom);                         // 배율을 즉시 확정(줌 애니메이션 레이스 방지) - 사용자 배율 유지
  const bb = eles.boundingBox();             // 모델 좌표(줌 무관)
  const mx = (bb.x1+bb.x2)/2, my=(bb.y1+bb.y2)/2;
  const w = cy.width(), h = cy.height();
  const OFFSET = Math.min(150, w*0.16);
  cy.animate({ pan:{ x: w/2 - OFFSET - mx*viewZoom, y: h/2 - my*viewZoom } },
             { duration:380, complete:()=>{ animatingView=false; } });  // 팬만 애니메이션
}

/* goTo */
function goTo(i, fromClick){
  const prev = STEPS[stepIdx];
  i = Math.max(0, Math.min(STEPS.length-1, i));
  const step = STEPS[i];
  // 엣지 애니메이션
  if(i!==stepIdx || fromClick){
    let via = step.via;
    if(!via){
      const from = prev.activeNodes[prev.activeNodes.length-1];
      const to = step.activeNodes[0];
      via = [from,to];
    }
    if(via) animateEdge(via[0],via[1]);
  }
  stepIdx = i;
  selectedNode = null;
  // 활성/딤
  cy.nodes().removeClass('active picked dim'); cy.edges().removeClass('dim');
  const act = step.activeNodes;
  cy.nodes().forEach(n=>{ if(!act.includes(n.id())) n.addClass('dim'); });
  cy.edges().forEach(e=>{ if(e.hasClass('flow')) return; e.addClass('dim'); });
  act.forEach(id=>cy.$('#'+id).addClass('active').removeClass('dim'));
  focusNodes(act);
  // 좌/우
  renderCtx();
  // 트리 하이라이트 + 뷰어 자동 로드
  const activeFiles = new Map(), touched = new Set();
  for(let k=0;k<=i;k++){ STEPS[k].activeNodes.forEach(id=>{ const nn=NODES.find(x=>x.id===id);
    (nn.files||[]).forEach(f=>touched.add(f.path)); }); }
  const curFiles=[];
  act.forEach(id=>{ const nn=NODES.find(x=>x.id===id); (nn.files||[]).forEach(f=>{ activeFiles.set(f.path,f.action); curFiles.push(f); }); });
  renderTree(activeFiles, touched);
  if(curFiles.length) showFiles(curFiles);
  renderDetail();
  // gate
  awaitingGate = !!step.gate;
  updateControls();
}

function updateControls(){
  document.getElementById('stepInd').textContent = (stepIdx+1)+' / '+STEPS.length;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  const gb = document.getElementById('gateBtn');
  gb.style.display = awaitingGate ? 'flex' : 'none';
}

/* 재생 */
function play(){ playing=true; updateControls();
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    if(awaitingGate) return;               // 게이트: 타이머는 살려두고 넘김
    if(stepIdx>=STEPS.length-1){ pause(); return; }
    goTo(stepIdx+1);
  },1500);
}
function pause(){ playing=false; if(timer){clearInterval(timer);timer=null;} updateControls(); }

/* 컨트롤 배선 */
document.getElementById('playBtn').addEventListener('click',()=>{ playing?pause():(stepIdx>=STEPS.length-1?(goTo(0),play()):play()); });
document.getElementById('forwardBtn').addEventListener('click',()=>{ if(awaitingGate){awaitingGate=false;updateControls();} goTo(stepIdx+1); });
document.getElementById('rewindBtn').addEventListener('click',()=>{ goTo(stepIdx-1); });
document.getElementById('fitBtn').addEventListener('click',()=>{
  animatingView=true; cy.resize(); cy.fit(cy.elements(),60);
  viewZoom = cy.zoom(); animatingView=false;
});
document.getElementById('gateBtn').addEventListener('click',()=>{ awaitingGate=false; updateControls(); if(playing){/*타이머가 이어감*/}else{ goTo(stepIdx+1); } });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ if(awaitingGate){awaitingGate=false;updateControls();} goTo(stepIdx+1); }
  else if(e.key==='ArrowLeft'){ goTo(stepIdx-1); }
});

/* 노드 클릭 → 그 시점으로 점프 (경로에 있으면) + 원문 */
function firstStepContaining(id){ for(let i=0;i<STEPS.length;i++){ if(STEPS[i].activeNodes.includes(id)) return i; } return -1; }
cy.on('tap','node',evt=>{
  const id = evt.target.id();
  const node = NODES.find(n=>n.id===id);
  const si = firstStepContaining(id);
  if(si>=0){ goTo(si); }
  else {
    // 경로 밖: 상세/원문만
    cy.nodes().removeClass('picked'); evt.target.addClass('picked');
    selectedNode = id; renderDetail();
    if(node.files&&node.files.length) showFiles(node.files);
  }
  // 항상 그 노드 파일을 뷰어에
  if(node.files&&node.files.length) showFiles(node.files);
});
cy.on('tap','edge',evt=>{ const t=evt.target.target().id(); const si=firstStepContaining(t); if(si>=0) goTo(si); });

/* 초기화 - 초기 줌은 전체 fit 대비 약 2배 확대해서 시작(텍스트가 크게 보이게) */
cy.ready(()=>{ cy.resize(); cy.fit(cy.elements(),60);
  viewZoom = Math.max(cy.zoom()*2, 1.05);
  animatingView=true; cy.zoom(viewZoom); animatingView=false;
  goTo(0); });
window.addEventListener('resize',()=>{ cy.resize(); focusNodes(STEPS[stepIdx].activeNodes); });
</script>
</body>
</html>
