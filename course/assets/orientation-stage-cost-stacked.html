<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모델별 실습 비용 누적(stage 합산) - 누적 막대 그래프</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page-plane);
    }

    .viz-root {
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --grid: #e1e0d9;
      --baseline: #c3c2b7;
      --page-plane: #f9f9f7;
      --border: rgba(11, 11, 11, 0.10);
      --stage-1: #2a78d6;
      --stage-2: #eb6834;
      --stage-3: #1baf7a;
      --stage-4: #eda100;
      --stage-5: #e87ba4;
      --stage-6: #008300;
      --stage-8: #e34948;
    }

    @media (prefers-color-scheme: dark) {
      .viz-root {
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --grid: #2c2c2a;
        --baseline: #383835;
        --page-plane: #0d0d0d;
        --border: rgba(255, 255, 255, 0.10);
        --stage-1: #3987e5;
        --stage-2: #d95926;
        --stage-3: #199e70;
        --stage-4: #c98500;
        --stage-5: #d55181;
        --stage-6: #008300;
        --stage-8: #e66767;
      }
    }

    .chart-card {
      max-width: 760px;
      margin: 24px auto;
      padding: 24px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    figcaption h1 {
      font-size: 20px;
      margin: 0 0 4px;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0 0 16px;
    }

    .legend {
      list-style: none;
      display: flex;
      gap: 16px;
      padding: 0;
      margin: 0 0 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
    }

    .chart-wrap {
      position: relative;
    }

    svg#chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .baseline {
      stroke: var(--baseline);
      stroke-width: 1.5;
    }

    .tick {
      font-size: 13px;
      fill: var(--text-muted);
    }

    .cat-label {
      font-size: 14px;
      fill: var(--text-secondary);
    }

    .total-label {
      font-size: 14px;
      font-weight: 700;
      fill: var(--text-primary);
    }

    .seg {
      transition: filter 0.1s ease;
    }

    .seg-hit {
      cursor: pointer;
      outline: none;
    }

    .seg-hit:hover .seg,
    .seg-hit:focus-visible .seg {
      filter: brightness(1.12);
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--text-primary);
      color: var(--surface-1);
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      z-index: 10;
    }

    .tooltip strong {
      font-size: 14px;
    }

    .tooltip .key {
      display: inline-block;
      width: 10px;
      height: 2px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .table-toggle {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }

    table {
      margin-top: 12px;
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    table th,
    table td {
      text-align: right;
      padding: 6px 10px;
      border-bottom: 1px solid var(--grid);
      color: var(--text-secondary);
    }

    table th[scope="row"] {
      text-align: left;
      color: var(--text-primary);
    }

    table thead th {
      color: var(--text-primary);
    }

    table tr:last-child th,
    table tr:last-child td {
      font-weight: 700;
      color: var(--text-primary);
    }

    caption {
      caption-side: top;
      text-align: left;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
  </style>
</head>

  <script>
    (function () {
      var tooltip = document.getElementById('tooltip');
      var wrap = document.querySelector('.chart-wrap');
      var segs = document.querySelectorAll('.seg-hit');

      function showTooltip(el) {
        var model = el.getAttribute('data-model');
        var stage = el.getAttribute('data-stage');
        var value = el.getAttribute('data-value');
        var color = el.getAttribute('data-color');
        tooltip.innerHTML = '';
        var key = document.createElement('span');
        key.className = 'key';
        key.style.background = color;
        var strong = document.createElement('strong');
        strong.textContent = '$' + value;
        var sep = document.createTextNode(' - ');
        var label = document.createElement('span');
        label.textContent = model + ' / ' + stage;
        tooltip.appendChild(key);
        tooltip.appendChild(strong);
        tooltip.appendChild(sep);
        tooltip.appendChild(label);
        tooltip.hidden = false;

        var rect = el.querySelector('.seg').getBoundingClientRect();
        var wrapRect = wrap.getBoundingClientRect();
        tooltip.style.left = (rect.left + rect.width / 2 - wrapRect.left) + 'px';
        tooltip.style.top = (rect.top - wrapRect.top - 8) + 'px';
      }

      function hideTooltip() {
        tooltip.hidden = true;
      }

      segs.forEach(function (el) {
        el.addEventListener('pointerenter', function () { showTooltip(el); });
        el.addEventListener('pointermove', function () { showTooltip(el); });
        el.addEventListener('pointerleave', hideTooltip);
        el.addEventListener('focus', function () { showTooltip(el); });
        el.addEventListener('blur', hideTooltip);
      });

      var toggleBtn = document.getElementById('toggle-table');
      var table = document.getElementById('data-table');
      toggleBtn.addEventListener('click', function () {
        var isHidden = table.hidden;
        table.hidden = !isHidden;
        toggleBtn.setAttribute('aria-expanded', String(isHidden));
        toggleBtn.textContent = isHidden ? '표 숨기기' : '표로 보기';
      });
    })();
  </script>
