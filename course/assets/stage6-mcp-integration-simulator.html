<script type="text/plain" data-path="CLAUDE.md">
# NVIDIA 적정가치 판단 프로젝트 - 분석 표준 (stage6: MCP 연동 - 실시간 수집 + 업무 워크플로우)

이 프로젝트는 stage3-5과 같은 과제(한 종목이 저평가/적정/고평가인지 판단)를 쓰되,
**정형 데이터의 원천을 정적 파일에서 실시간 MCP 조회로 바꾸고**, 완성된 리포트를 **파일 공유로
실제 업무 워크플로우(메일 발송)에 얹는다**.

## stage5 대비 무엇이 바뀌었나
| 항목 | stage3-5 | stage6 |
| 재무 데이터 원천 | data/financials.json (정적, FY2026 연간) | financial-datasets 실시간 조회 (분기, 실패 시 폴백) |
| hook의 검증 방식 | 리포트 값을 고정된 정답과 대조 | 리포트가 스스로 인용한 원자료로부터 내부 일관성을 재계산해 대조 - 정답 파일이 없다 |
| 새 필수 규율 | - | '데이터 출처:' 마커(실시간/폴백) + 실시간이면 SEC accession 번호 인용 |
| 산출물 이후 단계 | 리포트 작성으로 끝 | 파일 공유로 완성 리포트 메일 발송까지 확장 |

## 정형 데이터 수집 절차 (신규 - 이 단계의 핵심)
1. 1차: 실시간 조회 시도. mcp__financial-datasets__get_financials(ticker=NVDA,
   metrics=[Revenues,OperatingIncomeLoss,NetIncomeLoss,EarningsPerShareDiluted], fiscal_periods=8)
2. 최근 분기(당기) 표준화: start_date~end_date가 정확히 3개월인 가장 최근 구간을 "당기 분기",
   같은 3개월짜리 전년 동기 구간을 "전기 분기"로. end_date로 실제 분기를 식별한다.
3. TTM(직전 4개 분기 합산) 역산: 응답 값은 회계연도 시작부터의 누적치(YTD)가 섞여 있다.
   표준 분기값 = 해당 구간 누적치 − 직전 구간 누적치. 최근 4개 표준 분기 합 = TTM.
4. 주가는 MCP가 주지 않는다: 주가·시총은 data/financials.json 시장 블록(정적)을 쓴다 -
   이건 폴백이 아니라 이 MCP의 커버리지 밖.
5. 실시간 조회 실패 시(사내망 등) → 즉시 data/financials.json(FY2026 연간)으로 전환.

## 데이터 출처 마커 (검증 스크립트가 이 줄을 읽는다)
- 실시간 성공: 데이터 출처: 실시간 조회(MCP) - financial-datasets get_financials(ticker=NVDA),
  accession 0001045810-26-000052, filed 2026-05-20
- 폴백: 데이터 출처: 정적 스냅샷(폴백) - data/financials.json(FY2026 10-K) + 폴백 사유: <이유>

## 이 단계의 진짜 교육 포인트
- stage3-5 hook은 "이미 정해진 하나의 정답"(정적 파일)과 리포트 값을 대조했다.
- stage6는 정형 데이터 자체가 조회 시점마다 달라질 수 있다. hook이 검증할 수 있는 최선은
  더 이상 "정답과 일치하는가"가 아니라 "스스로 인용한 원자료로부터 올바르게 계산했는가 +
  그 원자료가 무엇인지 밝혔는가"다. 판정 기준의 형식지화가 한 번에 끝나는 일이 아니라,
  데이터가 살아있는 한 검증 방식 자체도 계속 다시 설계해야 하는 유지보수 작업임을 보여준다.

## 워크플로우 (loop)
1. financial-datasets get_financials로 NVDA 최근 8개 구간 조회 → 최근 분기·TTM 역산 (실패 시 폴백)
2. raw/(비정형) 읽기 → /fair-value-report NVIDIA → reports/fair-value.md
3. fair-value-reviewer subagent로 정성·종합·범위밖 근거 채점 (Skill 내 동기 호출)
4. Claude가 한 턴 응답을 마칠 때마다 → 자동 Stop hook 트리거:
   scripts/validate_fair_value.py 자동 실행 → 형식·데이터출처 마커·정량 지표 내부 일관성·
   미래 예상 가정 범위 검증. 통과=조용히 진행, 실패=stderr 사유 → Claude가 리포트 재작성.
   Ctrl+C(사용자 인터럽트)에는 반응하지 않는다.
5. hook 통과 + 리뷰어 PASS 되면 /리포트 공유로 파일 공유 메일 발송
</script>

# 적정가치 판단 리포트 작성 (실시간 MCP 조회 + 정형+비정형 종합 + 이중 오라클)

## Skill 내 진행 (Claude 응답 도중)
1. 실시간 정형 데이터 조회: mcp__financial-datasets__get_financials(ticker=NVDA,
   metrics=[Revenues,OperatingIncomeLoss,NetIncomeLoss,EarningsPerShareDiluted], fiscal_periods=8)
   - 성공: end_date가 최근인 3개월짜리 구간(당기)과 전년 동기(전기)를 골라 TTM 역산.
   - 실패(도구 오류·타임아웃): data/financials.json으로 전환하고 이유를 기록('폴백 사유:').
2. 주가: data/financials.json의 시장.주가 (모드 무관 - financial-datasets는 시세 미제공).
3. 비정형 읽기: raw/뉴스-*.md·raw/애널리스트-*.md·raw/적정가-가정-*.md에서 성장성·리스크·
   목표주가·적정가 가정을 뽑는다. 긍정/우려 요인 균형, 출처 인라인.
4. 정형 지표 계산: (실시간) TTM 주당순이익·주가배수, 최근 분기 YoY, 영업이익률을 직접 계산.
5. 종합 판정: 정량 신호 + 정성(미래 예상 가정)을 종합해 저평가/적정/고평가 중 하나.
6. 리포트 작성: 필수 섹션 순서대로 reports/fair-value.md. 실시간 모드면
   '### 최근 분기 재무 데이터'·'### TTM 주당순이익 역산' 표 포함 + '데이터 출처:' 마커.
7. 비정형(정성) 채점 - Reviewer subagent: 작성 후 .claude/agents/fair-value-reviewer.md를
   동기적으로 호출해 채점. PASS(>=9/16)/FAIL. → 이 Skill 내에서 블로킹으로 나온다.

## 이중 오라클의 두 번째 단계 (Claude 응답 종료 직후 - 자동 Stop hook)
8. 정형(결정론) 검증 - Stop hook: Claude가 1~7을 마치고 응답을 종료하자마자(사용자 인터럽트
   제외) settings.json의 Stop hook이 자동 실행 → scripts/validate_fair_value.py.
   결과: exit 0(통과) / exit 2(실패, stderr에 사유).

## 통과 조건 (양쪽 모두 만족해야 진행)
- Reviewer PASS(>=9/16) AND Hook exit 0
- 하나라도 실패하면: Claude가 stderr/reviewer 피드백을 받아 리포트를 재작성 → 6번부터 반복(루프).

## 검증 통과 후
- 사용자가 /리포트 공유 호출 → 리포트 공유 SKILL → 파일 공유 mail_send로 메일 발송.

# 적정가치 리포트 리뷰어 (LLM-as-judge, 비정형 전담)

너는 까다로운 리서치 심사역이다. 결정론 hook(validate_fair_value.py)이 이미 형식·정량 지표
재계산과 "미래 예상 가정이 적정 범위 안인가"까지 검사했다. 너는 hook이 판정할 수 없는
주관 영역만 채점한다.

    elif "정적 스냅샷(폴백)" in line:

최근 분기 성장세가 그 가정을 뒷받침해 **저평가**로 판단한다. 핵심 리스크는 자체 칩·AMD 경쟁.

### 판정 근거 미래 예상 가정
- 목표 주가배수: 29.0배
- 장기 이익 성장률: 27.5%
(애널리스트 평균 관측치 채택. 적정 범위(18.0~35.0배, 20.0~44.0%) 안.)

## 출처
- financial-datasets get_financials(ticker=NVDA) 실시간 조회 (SEC EDGAR XBRL, CIK 1045810)
- data/financials.json (주가·시가총액 - financial-datasets는 시세 미제공)
- raw/뉴스-NVIDIA-2026Q2전망.md, raw/애널리스트-의견-2026.md, raw/적정가-가정-2026.md
- data/assumptions.json (적정 범위 근거: assumptions-bands.md)

# 완성 리포트 메일 발송 (파일 공유 워크플로우 연동)

리포트는 파일로 완성되는 게 아니라 실제 업무 프로세스(보고·공유)에 얹혀야 끝난다.

## 실행 전 확인
1. validate_fair_value.py 통과(exit 0)했는가?
2. fair-value-reviewer subagent 채점이 PASS(>=9/16)인가?
   → 하나라도 아니면 먼저 리포트를 고친다. 검증 안 된 리포트를 보내지 않는다.

## 메일 구성
- 제목: [적정가치 리포트] NVIDIA(NVDA) 판정 결과 - <저평가/적정/고평가>
- 본문: '## 종합 판정'·'## 결론'을 3~5문장 요약.
- 수신자: 실습자 본인 사내 이메일(선택한 공유 채널) - 파일 공유는 그 외 도메인을 거부.

## 호출 방법
파일 저장 를 subject/contents/sender/recipients 형태로 호출.

## 발송 후
- 응답의 mailId를 reports/fair-value.md 맨 끝에 '> 메일 발송 완료: mailId=<값>' 한 줄로 덧붙인다.

const ACTOR_ICON = { human:'👤', ai:'🤖' };

/* ── 사이징은 고정 px가 아니라 "텍스트 측정"으로 계산한다 (스킬 사이징 3원칙) ──
   ① 노드 안 텍스트는 반드시 다 들어간다: 라벨을 오프스크린 canvas로 측정 → 박스 크기 계산.
   ② 엣지 라벨 폰트 = 노드 라벨 폰트: 단 하나의 FONT_SIZE를 공유.
   ③ 노드 폭 : 화살표 최소 길이 = 1:1: 컬럼 간격을 노드 폭으로 유도(라벨 있으면 더 넓힘). */
const FONT_SIZE = 26;   // 노드 11개·최장 체인에 맞춘 시작값(노드·엣지 라벨이 공유)
const FAMILY = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
function measure(text, fontPx, weight){
  const ctx = measure._ctx || (measure._ctx = document.createElement('canvas').getContext('2d'));
  ctx.font = (weight||600)+' '+fontPx+'px '+FAMILY;
  return Math.max(...String(text).split('\n').map(l=>ctx.measureText(l).width));
}
const PAD_X = 30, PAD_Y = 22, LINE_H = FONT_SIZE*1.3;
// (원칙 1) 각 노드 라벨을 실제 측정해 박스 크기 계산 - 긴 툴 이름/경로도 안 잘리게.
NODES.forEach(n=>{
  const lines = ((ACTOR_ICON[n.actor]||'')+' '+n.label).split('\n');
  const w = Math.max(...lines.map(l=>measure(l, FONT_SIZE))) + PAD_X*2;
  const h = lines.length*LINE_H + PAD_Y*2;
  const k = n.cat==='gate' ? 1.4 : 1;      // 다이아몬드는 대각선 여유가 더 필요
  n.w = Math.ceil(w*k); n.h = Math.ceil(h*k);
});
const NODE = Object.fromEntries(NODES.map(n=>[n.id,n]));

// (원칙 3) 진행축 컬럼 간격 = 노드 폭 1:1(화살표 최소 길이 ≈ 노드 폭). 라벨 있는 엣지는 더 넓힘.
const colWidth = {};
NODES.forEach(n=>{ colWidth[n.col] = Math.max(colWidth[n.col]||0, n.w); });
const maxCol = Math.max(...NODES.map(n=>n.col));
const xOfCol = {0:0};
for(let c=1;c<=maxCol;c++){
  let gap = (colWidth[c-1]+colWidth[c])/2;                        // 1:1 기준
  EDGES.forEach(e=>{
    const a=NODE[e.from], b=NODE[e.to];
    if(a&&b&&a.col===c-1&&b.col===c&&e.label)
      gap = Math.max(gap, measure(e.label, FONT_SIZE, 700)+48);   // 라벨이 더 넓으면 그만큼 벌림
  });
  xOfCol[c] = xOfCol[c-1] + colWidth[c-1]/2 + gap + colWidth[c]/2;
}
const rowHeight = {};
NODES.forEach(n=>{ rowHeight[n.row] = Math.max(rowHeight[n.row]||0, n.h); });
const MRH = Math.max(...Object.values(rowHeight));
const ROW_Y = MRH + 48;   // 분기축은 1:1 대상 아님 - 노드 높이 + 여백만 확보

const elements = [
  ...NODES.map(n=>({ data:{ id:n.id, label:(ACTOR_ICON[n.actor]||'')+' '+n.label, cat:n.cat, actor:n.actor, w:n.w, h:n.h },
                     position:{ x:xOfCol[n.col], y:n.row*ROW_Y } })),
  ...EDGES.map((e,i)=>({ data:{ id:'e'+i, source:e.from, target:e.to, label:e.label||'', kind:e.kind||'' } })),
];

const cy = cytoscape({
  container: document.getElementById('flow'),
  elements,
  layout:{ name:'preset' },
  wheelSensitivity:0.2,
  style:[
    // 노드 크기 = 측정값 data(w)/data(h). 여기서 고정 width/height를 다시 주지 않는다(측정 무의미해짐).
    { selector:'node', style:{
        'label':'data(label)','text-valign':'center','text-halign':'center','text-wrap':'wrap',
        'font-family':FAMILY,'width':'data(w)','height':'data(h)','font-size':FONT_SIZE,'color':'#1a1a1a','font-weight':600,
        'background-color':'#fff','border-width':3,'border-color':'#c9c9c9','shape':'round-rectangle',
        'transition-property':'opacity','transition-duration':'0.25s' } },
    { selector:'node[cat="input"]',    style:{ 'border-color':'#e8862a','background-color':'#fff4e8' } },
    { selector:'node[cat="data"]',     style:{ 'border-color':'#33a852','background-color':'#eefaf2' } },
    { selector:'node[cat="mcp"]',      style:{ 'border-color':'#d81b8c','background-color':'#fde7f3','border-width':6 } },
    { selector:'node[cat="unstr"]',    style:{ 'border-color':'#9b59b6','background-color':'#f6eefb' } },
    { selector:'node[cat="output"]',   style:{ 'border-color':'#5b6b7f','background-color':'#eef1f5' } },
    { selector:'node[cat="informal"]', style:{ 'border-color':'#4a7dff','background-color':'#eef3ff' } },
    { selector:'node[cat="formal"]',   style:{ 'border-color':'#12a5a5','background-color':'#e6f7f7' } },
    { selector:'node[cat="gate"]',     style:{ 'border-color':'#d4a017','background-color':'#fdf6e3','shape':'round-diamond' } },
    { selector:'node[actor="human"]',  style:{ 'border-style':'dashed' } },
    { selector:'node.active', style:{ 'border-color':'#d97757','border-width':8,'background-color':'#fff3ee',
        'overlay-color':'#d97757','overlay-opacity':0.16,'overlay-padding':24,'z-index':99 } },
    { selector:'node.picked', style:{ 'border-color':'#2a5fd0','border-width':5,'border-style':'double' } },
    { selector:'node.dim',    style:{ 'opacity':0.32 } },
    { selector:'edge', style:{
        'width':3,'line-color':'#b7b7b7','target-arrow-color':'#b7b7b7','target-arrow-shape':'triangle',
        'arrow-scale':Math.max(1.4, FONT_SIZE/16),                 // (원칙 2) 화살촉도 FONT_SIZE에 비례
        'curve-style':'bezier','font-family':FAMILY,'label':'data(label)','font-size':FONT_SIZE,'font-weight':700,'color':'#222', // (원칙 2) 노드와 동일 폰트
        'text-background-color':'#fff','text-background-opacity':1,'text-background-padding':6,
        'text-background-shape':'roundrectangle','text-border-color':'#d0d0d0','text-border-width':1,'text-border-opacity':1,
        'text-rotation':'none','z-index':30,'z-index-compare':'manual',
        'transition-property':'opacity','transition-duration':'0.25s' } },
    { selector:'edge[kind="loopback"]', style:{ 'line-style':'dashed','line-color':'#d98a6a',
        'target-arrow-color':'#d98a6a','color':'#b5623d','curve-style':'unbundled-bezier',
        'control-point-distances':[MRH*1.6],'control-point-weights':[0.5],'text-border-color':'#e0b3a0' } },
    // 두 루프백은 아치 높이를 달리해 선·라벨이 겹치지 않게(짧은 되돌림=낮게, 긴 되돌림=높게).
    { selector:'edge[source="DECR"][target="REP"]', style:{ 'control-point-distances':[MRH*1.3] } },
    { selector:'edge[source="DECH"][target="REP"]', style:{ 'control-point-distances':[MRH*2.7] } },
    { selector:'edge.flow', style:{ 'line-color':'#d97757','target-arrow-color':'#d97757','width':6,
        'line-style':'dashed','line-dash-pattern':[12,7],'z-index':98,'opacity':1 } },
    { selector:'edge.dim',  style:{ 'opacity':0.18 } },
  ],
});

/* ============ 상태 ============ */
let stepIdx=-1, playing=false, timer=null, awaitingGate=false, pulseRAF=null, flowRAF=null;
const $=id=>document.getElementById(id);

function focusNode(ids){
  const eles = cy.collection(ids.map(i=>cy.$('#'+i)));
  if(!eles.length) return;
  const bb=eles.boundingBox();
  const z=cy.zoom();                       // ⚠ 고정 배율로 강제하지 않는다 - 사용자가 맞춰둔 현재 배율 유지
  const mx=(bb.x1+bb.x2)/2, my=(bb.y1+bb.y2)/2;
  const w=cy.width(), h=cy.height();
  // 우상단 범례가 활성 노드를 가리지 않게 살짝 왼쪽으로. 축소(전체 보기) 상태에선 오프셋도 줄인다.
  const OFF=Math.min(300, 300*z);
  cy.animate({ pan:{ x:w/2-OFF-mx*z, y:h/2-my*z } }, { duration:360 });  // zoom은 건드리지 않고 pan만 이동
}
function pulse(){
  cancelAnimationFrame(pulseRAF);
  const t0=performance.now();
  const tick=(t)=>{ const s=(Math.sin((t-t0)/380)+1)/2;
    cy.$('.active').style({ 'overlay-padding':18+s*16, 'overlay-opacity':0.10+s*0.14 });
    pulseRAF=requestAnimationFrame(tick); };
  pulseRAF=requestAnimationFrame(tick);
}
function animateEdge(fromId,toId){
  const e=cy.edges(`[source="${fromId}"][target="${toId}"]`);
  cy.edges('.flow').removeClass('flow');
  cancelAnimationFrame(flowRAF);
  if(!e.length) return;
  e.addClass('flow'); let off=0;
  const tick=()=>{ off=(off-2)%160; e.style('line-dash-offset',off); flowRAF=requestAnimationFrame(tick); };
  flowRAF=requestAnimationFrame(tick);
}
function spotlight(activeIds){
  cy.nodes().removeClass('dim'); cy.edges().removeClass('dim');
  const act=new Set(activeIds);
  cy.nodes().forEach(n=>{ if(!act.has(n.id())) n.addClass('dim'); });
  cy.edges().forEach(e=>{ if(!(act.has(e.data('source'))&&act.has(e.data('target')))) e.addClass('dim'); });
}

/* ---- context 누적 패널 ---- */
const CATLABEL={input:'입력(사람)',data:'정형 데이터',mcp:'MCP 호출',unstr:'비정형',output:'산출물',informal:'비정형 검증',formal:'정형 검증'};
const CATCOLOR={input:'#e8862a',data:'#33a852',mcp:'#d81b8c',unstr:'#9b59b6',output:'#5b6b7f',informal:'#4a7dff',formal:'#12a5a5'};
function renderContext(){
  const wrap=$('ctxlist'); wrap.innerHTML='';
  let items=[];
  for(let i=0;i<=stepIdx;i++){ (STEPS[i].ctxAdd||[]).forEach(c=>items.push({...c,step:i})); }
  items.forEach((c,idx)=>{
    const el=document.createElement('div');
    el.className='ctxitem'+(idx===items.length-1?' newest':'');
    el.style.borderLeftColor=CATCOLOR[c.cat]||'#ccc';
    el.innerHTML=`${escapeHtml(c.label)}<small>${CATLABEL[c.cat]||c.cat} · 스텝 ${c.step+1}</small>`;
    wrap.appendChild(el);
  });
  $('ctxcount').textContent = items.length?`지금까지 ${items.length}개 누적`:'아직 비어 있음';
  wrap.scrollTop=wrap.scrollHeight;
}

/* ---- 트리 ---- */
let touched=new Set();
function renderTree(activeFiles){
  const box=$('tree'); box.innerHTML='';
  const actMap={}; (activeFiles||[]).forEach(f=>actMap[f.path]=f.action);
  TREE.forEach(t=>{
    const el=document.createElement('div');
    el.className='tnode '+(t.k==='dir'?'dir':'file');
    el.style.paddingLeft=(6+t.d*16)+'px';
    let inner=(t.k==='dir'?'📁 ':'📄 ')+escapeHtml(t.name);
    if(t.k==='file'){
      if(actMap[t.path]){ el.classList.add('active','hl-'+actMap[t.path]);
        inner+=`<span class="act">${actMap[t.path].toUpperCase()}</span>`; }
      else if(touched.has(t.path)) el.classList.add('touched');
      el.onclick=()=>{ showFiles([{path:t.path,action:actMap[t.path]||'read'}]); selectNodeByFile(t.path); };
    }
    el.innerHTML=inner;
    box.appendChild(el);
  });
}
function selectNodeByFile(path){
  const n=NODES.find(n=>n.files.some(f=>f.path===path));
  if(n){ cy.nodes().removeClass('picked'); cy.$('#'+n.id).addClass('picked'); }
}

/* ---- 파일 뷰어 ---- */
let vfiles=[], vactive=0;
function showFiles(files){
  vfiles=files||[]; vactive=0;
  const tabs=$('vtabs'); tabs.innerHTML='';
  if(!vfiles.length){ $('vbody').textContent='(이 노드는 참조 파일이 없습니다)'; return; }
  vfiles.forEach((f,i)=>{
    const b=document.createElement('button'); b.className='vtab'+(i===0?' on':'');
    b.textContent=f.path.split('/').pop()+(f.action?` [${f.action}]`:'');
    b.onclick=()=>{ vactive=i; [...tabs.children].forEach((c,j)=>c.classList.toggle('on',j===i)); paintFile(); };
    tabs.appendChild(b);
  });
  paintFile();
}
function paintFile(){
  const f=vfiles[vactive]; if(!f) return;
  $('vbody').textContent = FILES[f.path]!==undefined ? FILES[f.path] : '(원문 임베드 없음: '+f.path+')';
  $('vbody').scrollTop=0;
}

/* ---- 상세 밴드 ---- */
function renderBand(){
  const band=$('band');
  if(stepIdx<0){
    band.innerHTML=`<div class="insight"><div class="k">KEY INSIGHT - 이 하네스의 핵심</div>
      <div class="t">${escapeHtml(KEY_INSIGHT)}</div></div>`;
    return;
  }
  const st=STEPS[stepIdx];
  const ns=st.activeNodes.map(id=>NODE[id]);
  const primary=ns[0];
  const descs=ns.map(n=>`<div class="band-desc"><b>${escapeHtml(n.label.replace(/\n/g,' '))}</b> ${escapeHtml(n.desc)}</div>`).join('');
  band.innerHTML=`
    ${st.note?`<div class="band-note">${escapeHtml(st.note)}</div>`:''}
    <div class="band-title">스텝 ${stepIdx+1} / ${STEPS.length}</div>
    ${descs}
    <div class="band-why">💡 왜 중요한가 - ${escapeHtml(primary.why)}</div>`;
}

/* ---- goTo ---- */
function goTo(i){
  if(i<-1) i=-1; if(i>STEPS.length-1) i=STEPS.length-1;
  const prev=stepIdx; stepIdx=i;
  cy.nodes().removeClass('active picked');
  if(stepIdx<0){
    cancelAnimationFrame(pulseRAF); cy.edges('.flow').removeClass('flow'); cancelAnimationFrame(flowRAF);
    cy.nodes().removeClass('dim'); cy.edges().removeClass('dim');
    renderContext(); renderTree([]); renderBand(); updateInd(); $('gate').style.display='none';
    return;
  }
  const st=STEPS[stepIdx];
  // 엣지 흐름 애니메이션 (직전 활성 → 현재 활성)
  if(prev>=0 && prev!==stepIdx){
    const a=STEPS[prev].activeNodes[0], b=st.activeNodes[0];
    animateEdge(a,b);
  } else { cy.edges('.flow').removeClass('flow'); }
  st.activeNodes.forEach(id=>cy.$('#'+id).addClass('active'));
  st.activeNodes.forEach(id=>NODE[id].files.forEach(f=>touched.add(f.path)));
  spotlight(st.activeNodes); pulse(); focusNode(st.activeNodes);
  const actFiles=st.activeNodes.flatMap(id=>NODE[id].files);
  renderContext(); renderTree(actFiles); renderBand(); updateInd();
  if(st.activeNodes.length===1) showFiles(NODE[st.activeNodes[0]].files);
  // 게이트
  if(st.gate){ awaitingGate=true; $('gate').style.display='block'; }
  else { awaitingGate=false; $('gate').style.display='none'; }
}
function updateInd(){ $('ind').textContent=`${stepIdx+1} / ${STEPS.length}`;
  $('rew').disabled=stepIdx<0; $('fwd').disabled=stepIdx>=STEPS.length-1; }

/* ---- 재생 ---- */
function play(){ playing=true; $('play').textContent='⏸';
  timer=setInterval(()=>{ if(awaitingGate) return;
    if(stepIdx>=STEPS.length-1){ pause(); return; } goTo(stepIdx+1); }, 1600); }
function pause(){ playing=false; $('play').textContent='⏵'; clearInterval(timer); timer=null; }
$('play').onclick=()=>{ if(playing) pause(); else { if(stepIdx>=STEPS.length-1) goTo(-1); play(); } };
$('fwd').onclick=()=>{ if(stepIdx<STEPS.length-1) goTo(stepIdx+1); };
$('rew').onclick=()=>{ goTo(stepIdx-1); };
// 🔍 전체 보기: 전체 그래프를 한 화면에 축소. 이후 forward/rewind/play는 focusNode가 cy.zoom()을
// 유지하므로 이 축소 배율 그대로 활성 노드만 패닝하며 따라간다.
$('fit').onclick=()=>{ cy.animate({ fit:{ eles:cy.elements(), padding:60 } }, { duration:420 }); };
$('gate').onclick=()=>{ awaitingGate=false; $('gate').style.display='none';
  if(!playing && stepIdx<STEPS.length-1) goTo(stepIdx+1); };
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ if(stepIdx<STEPS.length-1) goTo(stepIdx+1); }
  else if(e.key==='ArrowLeft'){ goTo(stepIdx-1); }
});

/* ---- 노드/엣지 클릭 → 시점 점프 ---- */
function firstStepContaining(id){ return STEPS.findIndex(s=>s.activeNodes.includes(id)); }
cy.on('tap','node',ev=>{
  const id=ev.target.id();
  cy.nodes().removeClass('picked'); ev.target.addClass('picked');
  showFiles(NODE[id].files);
  const si=firstStepContaining(id);
  if(si>=0) goTo(si);
  else { // 경로 밖 노드(예: 폴백) - 상세만
    const n=NODE[id];
    $('band').innerHTML=`<div class="band-note">경로 밖 노드(재생 스텝 아님)</div>
      <div class="band-title">${escapeHtml(n.label.replace(/\n/g,' '))}</div>
      <div class="band-desc">${escapeHtml(n.desc)}</div>
      <div class="band-why">💡 ${escapeHtml(n.why)}</div>`;
  }
});
cy.on('tap','edge',ev=>{ const t=ev.target.data('target'); const si=firstStepContaining(t); if(si>=0) goTo(si); });

/* ---- 범례 ---- */
function buildLegend(){
  const cats=[['input','입력(사람 시작)'],['mcp','🔌 MCP 호출(financial-datasets·공유)'],['data','정형 데이터(분기/폴백)'],['unstr','비정형(raw/)'],
              ['output','산출물(리포트/메일)'],['informal','비정형 검증(subagent)'],['formal','정형 검증(hook)'],['gate','판정/분기']];
  let h='<b>카테고리</b>';
  cats.forEach(([c,l])=>{ const col=c==='gate'?'#d4a017':CATCOLOR[c];
    const em = c==='mcp' ? ';font-weight:800' : '';
    h+=`<div class="row" style="${em?'font-weight:800':''}"><span class="dot" style="border-color:${col};background:${col}33"></span>${l}</div>`; });
  h+='<b>실행 주체</b><div class="row">👤 사람 · 🤖 AI</div>';
  h+='<b>엣지</b><div class="row">→ 진행 · ⤴ 루프백(점선)</div><div class="row"><span class="dot" style="border-color:#d97757;background:#d9775733"></span>주황 흐름 = 지금 지나가는 경로</div>';
  $('legend').innerHTML=h;
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ---- 초기화 ---- */
buildLegend();
cy.ready(()=>{ cy.zoom(1.24); cy.center(cy.$('#U')); cy.panBy({x:-260,y:20}); goTo(-1); });
</script>
</body>
</html>
