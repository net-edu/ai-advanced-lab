<rect x='180' y='755' width='1240' height='52' rx='18' fill='#FEF3C7' stroke='#D97706' stroke-width='2'/><text x='800' y='789' text-anchor='middle' font-size='22' font-weight='700' fill='#0F172A'><tspan x='800' dy='0'>마켓플레이스는 배포 경로를 표준화하는 장치입니다.</tspan></text>
