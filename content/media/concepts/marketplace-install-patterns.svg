<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-label='세 가지 설치 패턴의 공통 결과'>
<defs><marker id='arrow' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto' markerUnits='strokeWidth'><path d='M2,2 L10,6 L2,10 Z' fill='#94A3B8'/></marker><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='8' stdDeviation='10' flood-color='#0F172A' flood-opacity='0.12'/></filter></defs>
<rect width='1600' height='900' fill='#F8FAFC'/><rect x='60' y='60' width='1480' height='780' rx='34' fill='white' stroke='#E2E8F0' stroke-width='2' filter='url(#shadow)'/>
