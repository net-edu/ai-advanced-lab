<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-label='Skill 로딩 흐름'>
<defs><marker id='arrow' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto' markerUnits='strokeWidth'><path d='M2,2 L10,6 L2,10 Z' fill='#94A3B8'/></marker><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='8' stdDeviation='10' flood-color='#0F172A' flood-opacity='0.12'/></filter></defs>
<rect width='1600' height='900' fill='#F8FAFC'/><rect x='60' y='60' width='1480' height='780' rx='34' fill='white' stroke='#E2E8F0' stroke-width='2' filter='url(#shadow)'/>
<text x='800' y='130' text-anchor='middle' font-size='44' font-weight='800' fill='#0F172A'><tspan x='800' dy='0'>Skill 로딩 흐름</tspan></text>
<text x='800' y='185' text-anchor='middle' font-size='24' font-weight='500' fill='#475569'><tspan x='800' dy='0'>평소엔 이름과 설명만, 호출되면 본문 전체가 들어온다</tspan></text>
<rect x='180' y='390' width='220' height='120' rx='18' fill='#DBEAFE' stroke='#2563EB' stroke-width='3'/><text x='290' y='443' text-anchor='middle' font-size='24' font-weight='700' fill='#0F172A'><tspan x='290' dy='0'>이름·설명 목록</tspan><tspan x='290' dy='30'>대기</tspan></text><line x1='400' y1='450' x2='435' y2='450' stroke='#94A3B8' stroke-width='5' stroke-linecap='round' marker-end='url(#arrow)'/><rect x='435' y='390' width='220' height='120' rx='18' fill='#DCFCE7' stroke='#16A34A' stroke-width='3'/><text x='545' y='443' text-anchor='middle' font-size='24' font-weight='700' fill='#0F172A'><tspan x='545' dy='0'>관련 상황 또는</tspan><tspan x='545' dy='30'>직접 호출</tspan></text><line x1='655' y1='450' x2='690' y2='450' stroke='#94A3B8' stroke-width='5' stroke-linecap='round' marker-end='url(#arrow)'/><rect x='690' y='390' width='220' height='120' rx='18' fill='#DBEAFE' stroke='#2563EB' stroke-width='3'/><text x='800' y='443' text-anchor='middle' font-size='24' font-weight='700' fill='#0F172A'><tspan x='800' dy='0'>SKILL.md</tspan><tspan x='800' dy='30'>본문 전체 로드</tspan></text><line x1='910' y1='450' x2='945' y2='450' stroke='#94A3B8' stroke-width='5' stroke-linecap='round' marker-end='url(#arrow)'/><rect x='945' y='390' width='220' height='120' rx='18' fill='#DCFCE7' stroke='#16A34A' stroke-width='3'/><text x='1055' y='458' text-anchor='middle' font-size='24' font-weight='700' fill='#0F172A'><tspan x='1055' dy='0'>세션 끝까지 유지</tspan></text><line x1='1165' y1='450' x2='1200' y2='450' stroke='#94A3B8' stroke-width='5' stroke-linecap='round' marker-end='url(#arrow)'/><rect x='1200' y='390' width='220' height='120' rx='18' fill='#DBEAFE' stroke='#2563EB' stroke-width='3'/><text x='1310' y='443' text-anchor='middle' font-size='24' font-weight='700' fill='#0F172A'><tspan x='1310' dy='0'>재호출 시 이미</tspan><tspan x='1310' dy='30'>로드됨 표시</tspan></text>
<rect x='180' y='755' width='1240' height='52' rx='18' fill='#FEF3C7' stroke='#D97706' stroke-width='2'/><text x='800' y='789' text-anchor='middle' font-size='22' font-weight='700' fill='#0F172A'><tspan x='800' dy='0'>긴 절차는 필요할 때만 펼쳐 토큰 비용을 줄입니다.</tspan></text>
