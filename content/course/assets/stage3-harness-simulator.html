# NVIDIA 적정가치 판단 프로젝트 - 분석 표준 (stage3: 하네스 구성)

이 프로젝트는 **한 종목(NVIDIA)이 저평가/적정/고평가인지 종합 판단**하는 리포트를 쓰는
실습용 harness다. 한 과제 안에서 **정형 데이터(재무제표→지표)와 비정형 데이터(리포트·뉴스→
정성 판단)를 모두 처리**하고 종합한다는 게 핵심이다.

> ✅ **실제 데이터**를 쓴다(가상 아님). 정형=NVIDIA 10-K(FY2026, SEC EDGAR), 비정형=공개
> 리서치·뉴스 발췌, 주가=실시간 시세. 출처는 각 파일·표에 명시.

## 산출물 위치
- 리포트는 반드시 **`reports/fair-value.md`** 한 파일에 쓴다.

## 리포트 필수 섹션 (5개, 순서 유지)
1. `## 종목 개요` - 종목명·코드·기준일·현재 주가·시가총액
2. `## 정량 분석 (정형)` - 지표를 계산식과 함께 표로. `data/financials.json`이 원천.
3. `## 정성 분석 (비정형)` - `raw/`의 리포트·뉴스에서 긍정 요인/우려 요인을 균형 있게 요약.
4. `## 종합 판정` - 정량 신호 + 정성 판단을 종합해 저평가/적정/고평가 중 하나 + 근거.
5. `## 결론` - 투자의견 + 판정을 좌우한 미래 예상 가정(목표 주가배수·성장률) 명시 + 유의점.

맨 끝에 `## 출처` 섹션.

## 정량 지표 규칙 (형식 고정 - 뒤 단계에서 이 값을 재계산해 검증)
| 지표 | 계산식 | 예(NVIDIA FY2026) |
|------|--------|-----|
| 주당순이익(EPS) | 희석주당이익(재무제표) | $4.90 |
| 주가배수(PER) | 주가 ÷ 주당순이익 | 44.3 |
| 매출 증가율(작년 대비) | (당기매출−전기매출) ÷ 전기매출 | 65.5% |
| 영업이익률 | 영업이익 ÷ 매출액 | 60.4% |
| 순이익 증가율(작년 대비) | (당기순이익−전기순이익) ÷ 전기순이익 | 64.7% |

> 출처 표기·금액 단위·소스 충돌 우선순위는 `.claude/rules/citation-format.md` 참고 -
> `reports/`를 다룰 때만 조건부로 로드되는 규칙이다(CLAUDE.md는 매 세션 무조건 로드).

## 정성 분석 규칙
- 긍정 요인·우려 요인을 각각 최소 2개 논거로, 한쪽으로 편중하지 않는다.
- "싸다(저평가)"는 주장은 성장률 25~30%가 몇 년간 유지된다는 예상에 의존한다 - 명시적으로 끌어낸다.

## 워크플로우
1. `data/financials.json` + `raw/` 전부 읽기
2. `/fair-value-report NVIDIA` 로 초안 → `reports/fair-value.md`
3. (이 stage엔 검증 장치가 없다 - 리포트가 나오면 끝)

# 적정가치 판단 리포트 작성 (정형+비정형 종합)

1. **정형 읽기**: `data/financials.json`에서 재무·주가 원자료를 읽고 CLAUDE.md 표대로
   주당순이익·주가배수(PER)·매출증가율·영업이익률·순이익증가율을 **직접 계산**한다(계산식 표기).
2. **비정형 읽기**: `raw/뉴스-*.md`·`raw/애널리스트-*.md`·`raw/적정가-가정-*.md`에서
   성장성·리스크·업황·목표주가·적정가 가정을 뽑는다. 긍정/우려 요인을 균형 있게, 출처 인라인.
3. **종합 판정**: 정량 신호(현재 실적 기준 지표)와 정성 판단(미래 예상 가정)을 종합해
   저평가/적정/고평가 중 하나를 고른다. 둘이 충돌하면(예: 현재 실적 기준 비쌈 vs 목표가 저평가)
   어느 쪽을 왜 더 신뢰하는지 밝히고, **판정을 좌우한 미래 예상 가정(목표 주가배수·성장률)을
   명시**한다.
4. CLAUDE.md 필수 섹션(종목 개요 → 정량 분석 → 정성 분석 → 종합 판정 → 결론 → 출처)대로

# [애널리스트] NVIDIA 목표주가·투자의견 요약 (실제 출처 기반 발췌)

> ✅ 실제 데이터(가상 아님). 시점·집계처에 따라 수치가 조금씩 다르다.

## 목표주가·투자의견 (매수 우세, 목표가 편차 큼)
- 애널리스트 61명 평균 의견 "적극 매수", 평균 목표주가 $304.64 또는 $305.86.
- 61명 중 가장 높은 목표가 $500 / 가장 낮은 목표가 $250.

## ★ 현재가($216.85)는 최저 목표가($250)보다도 낮다
- NVIDIA는 애널리스트 61명의 목표주가가 전부($250~$500) 현재가보다 높다 - "거의 모든
  애널리스트가 지금 주가를 싸다고 본다"는 뜻. 다만 현재 실적 기준 PER 33~44배는 절대적으로
  보면 비싸 보인다 - 이 차이를 정성 분석에서 다뤄야 한다.

## 미래 실적을 반영한 주가배수
- 미래 예상 실적 기준 주가배수 34.2배 - 반도체 업종 평균보다 89% 높음.
- 2026년 달력연도 기준 미래 예상 주가배수 약 29배.
- 매출 성장 전망: 이번 회계연도 $395.23B(+83.03%), 다음 $568.63B(+43.87%).
- 애널리스트들은 3년 뒤에도 순이익·매출 성장률 25~30%대를 예상.

## 긍정 요인
- 데이터센터·AI 인프라 수요 지속, Blackwell 생산 확대, 대형 고객사 설비 투자 지속.
- 압도적 시장 지배력 - 세계 시가총액 1위, 반도체 시가총액 1위.

## 우려 요인
- 맞춤형 반도체 확산(TPU·Trainium·커스텀 가속기)이 범용 GPU를 대체하는 흐름.
- AMD 경쟁 심화(MI300, 주당순이익 +64% 전망).
- 높은 주가배수의 위험 - "완벽한 성장"을 전제하므로 기대치가 꺾이면 배수 자체가 하락.
- 현재 실적 기준 주가배수(33~44배)가 절대 기준으로 여전히 높음.

# [적정가 계산 가정] NVIDIA 적정가 산정 가정 (실제 출처 기반)

> ✅ 실제 데이터. Simply Wall St 커뮤니티 계산모델 가정 개정 내역 - 이번 개정 폭은 작다.

## 적정가 계산모델의 가정 개정 (이전 → 이후)
| 가정 | 이전 | 이후 | 효과 |
|------|------|------|------|
| 미래 예상 주가배수 | 29.02배 | 28.93배 | ↓ (미세) |
| 매출 성장률 | 37.36% | 37.36% | 변화 없음 |
| 순이익률 | 53.69% | 53.69% | 변화 없음 |
| → 계산된 적정가 | $269.23 | $268.22 | -0.37% |

## 애널리스트 간 목표주가 편차 (진짜 변주 지점)
- 평균 목표주가 $304.64~305.86, 최고 $500 / 최저 $250 - 편차가 2배에 가깝다.
- Simply Wall St 계산모델 적정가($268.22)는 애널리스트 평균($305)보다 낮다.

## 읽는 법 (이 예시의 핵심)
- 한 계산모델 안 수정은 미미하지만, 애널리스트 61명 사이 목표주가는 $250~$500로 2배 벌어진다.
- 현재 실적 기준 NVIDIA는 비싸다(33~44배). 그런데 거의 모든 목표주가가 현재가보다 높다 -
  "싸다"는 결론이 앞으로도 높은 성장률(25~30%)이 몇 년간 유지된다는 예상에 전적으로 의존한다.
- 따라서 "저평가/적정/고평가" 판정은 어떤 성장률·미래 주가배수를 쓰느냐에 달렸다. 그 적정
  범위를 여러 리포트에서 역산해 명확한 기준으로 만드는 것이 이 실습의 마지막 단계다.

// ================== cytoscape - 사이징은 고정 px가 아니라 "텍스트 측정"으로 계산 ==================
// 사이징 3원칙: ① 노드 텍스트는 반드시 다 들어가게(측정→박스 크기), ② 엣지 라벨 폰트 = 노드 폰트
// (FONT_SIZE 하나 공유), ③ 노드 폭 : 화살표 최소 길이 = 1:1 (라벨 있으면 그만큼 더 넓힘).
const FONT_SIZE = 22;             // 노드 라벨·엣지 라벨이 공유하는 단 하나의 값(노드 13개·한글 라벨 기준)
const INIT_ZOOM = 1.24;           // 전체 fit 대비 확대해서 시작
function measure(text, fontPx, weight=600) {
  const ctx = measure._ctx || (measure._ctx = document.createElement('canvas').getContext('2d'));
  ctx.font = `${weight} ${fontPx}px sans-serif`;
  return Math.max(...text.split('\n').map(line => ctx.measureText(line).width));
}
const PAD_X = 26, PAD_Y = 20, LINE_H = FONT_SIZE * 1.3;
// ① 각 노드 라벨을 실제로 측정해 박스 폭/높이(w/h)를 계산 - 텍스트가 반드시 다 들어가게
NODES.forEach(n => {
  const lines = ((ACTOR_ICON[n.actor]||'')+' '+n.label).split('\n');
  const w = Math.max(...lines.map(l => measure(l, FONT_SIZE))) + PAD_X*2;
  const h = lines.length*LINE_H + PAD_Y*2;
  const k = n.shape==='diamond' ? 1.4 : (n.shape==='octagon' ? 1.15 : 1); // 대각선/모서리 여유
  n.w = w*k; n.h = h*k;
});
// ③ 노드 폭 : 화살표 최소 길이 = 1:1 로 컬럼 간 x간격을 누적 계산(라벨 있으면 그만큼 더 넓힘)
const NODE = Object.fromEntries(NODES.map(n=>[n.id,n]));
const colWidth = {}; NODES.forEach(n => { colWidth[n.col] = Math.max(colWidth[n.col]||0, n.w); });
const maxCol = Math.max(...NODES.map(n=>n.col));
const xOfCol = {0:0};
for (let c=1; c<=maxCol; c++) {
  let gap = (colWidth[c-1] + colWidth[c]) / 2;                    // 1:1 기준: 화살표 길이 ≈ 노드 폭
  EDGES.forEach(e => { const a=NODE[e.from], b=NODE[e.to];
    if (a&&b&&a.col===c-1&&b.col===c&&e.label) gap = Math.max(gap, measure(e.label, FONT_SIZE, 700)+40); });
  xOfCol[c] = xOfCol[c-1] + colWidth[c-1]/2 + gap + colWidth[c]/2;
}
const rowHeight = {}; NODES.forEach(n => { rowHeight[n.row] = Math.max(rowHeight[n.row]||0, n.h); });
const ROW_SPACING = Math.max(...Object.values(rowHeight)) + 46;   // 분기축 간격(노드 높이 측정 기반)

  ...EDGES.map((e,i) => ({ data:{ id:'e'+i, source:e.from, target:e.to, label:e.label||'',

];

function focusNodes(ids) {
  let eles = cy.collection(); ids.forEach(id => eles = eles.union(cy.$id(id)));
  if (!eles.length) return;
  cy.stop(); // 이전 카메라 애니메이션 취소 - 사용자가 설정한 배율(전체 보기 등) 유지
  const bb = eles.boundingBox(), z = cy.zoom();
  const mx = (bb.x1+bb.x2)/2, my = (bb.y1+bb.y2)/2;
  const OFFSET = 210; // 우상단 범례가 활성 노드를 가리지 않게 살짝 왼쪽
  cy.animate({ pan:{ x: cy.width()/2 - OFFSET - mx*z, y: cy.height()/2 - my*z }, zoom:z }, { duration:420 });
}

// 스포트라이트: 활성 외 dim + halo 펄스
function applySpotlight(activeIds) {
  cy.nodes().removeClass('dim active'); cy.edges().removeClass('dim');
  const act = cy.collection(); activeIds.forEach(id => act.merge(cy.$id(id)));
  cy.nodes().difference(act).addClass('dim');
  cy.edges().forEach(e => { if (!act.contains(e.source()) && !act.contains(e.target())) e.addClass('dim'); });
  act.addClass('active');
  startHalo(act);
}
function startHalo(act) {
  if (haloRAF) cancelAnimationFrame(haloRAF);
  let t = 0;
  const tick = () => {
    t += 0.06;
    const p = 12 + Math.sin(t)*6, o = 0.10 + (Math.sin(t)+1)/2*0.10;
    act.style('overlay-padding', p); act.style('overlay-opacity', o);
    haloRAF = requestAnimationFrame(tick);
  };
  tick();
}
function animateEdge(fromId, toId) {
  cy.edges('.flow').removeClass('flow');
  if (flowRAF) cancelAnimationFrame(flowRAF);
  const e = cy.edges(`[source="${fromId}"][target="${toId}"]`);
  if (!e.length) return;
  e.removeClass('dim').addClass('flow');
  let off = 0;
  const tick = () => { off = (off - 2.4) % 152; e.style('line-dash-offset', off); flowRAF = requestAnimationFrame(tick); };
  tick();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    let cls = 'tree-item ' + t.k;
    let badge = '';
    if (t.path && activeFiles.has(t.path)) { cls += ' current'; const a = actionOf[t.path]; if (a) badge = `<span class="badge ${a}">${a==='write'?'쓰기':'읽기'}</span>`; }
    else if (t.path && seenFiles.has(t.path)) cls += ' seen';
    return `<div class="${cls}" ${t.path?`data-path="${esc(t.path)}"`:''}>${indent}${esc(t.name)}${badge}</div>`;
  }).join('');
  $('tree').querySelectorAll('.tree-item.file[data-path]').forEach(el => el.onclick = () => showFiles([{path:el.dataset.path}]));
}

// 우: 파일 뷰어
let viewerFiles = [], viewerActive = 0;
function showFiles(files) {
  viewerFiles = (files||[]).filter(f => FILES[f.path] !== undefined); viewerActive = 0;
  if (!viewerFiles.length) { $('tabs').innerHTML=''; $('viewer').innerHTML='<span class="empty">이 단계는 참조 파일이 없습니다 (사람 개입 지점 등).</span>'; return; }
  renderTabs(); renderViewer();
}
function renderTabs() {
  $('tabs').innerHTML = viewerFiles.map((p,i) => `<span class="tab${i===viewerActive?' active':''}" data-i="${i}">${esc(p.path.split('/').pop())}</span>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => { viewerActive = +t.dataset.i; renderTabs(); renderViewer(); });
}
function renderViewer() {
  const p = viewerFiles[viewerActive].path;
  $('viewer').innerHTML = `<div class="path">${esc(p)}</div>${esc(FILES[p]||'(원문 없음)')}`;
}

// 하단: 상세
function renderDetail() {
  const d = $('detail');
  if (stepIdx < 0) { d.className = 'detail insight'; d.innerHTML = `<h4>💡 핵심 요약</h4>${KEY_INSIGHT}`; return; }
  const s = STEPS[stepIdx], n = nodeById(s.active[0]);
  d.className = 'detail';
  const atag = `<span class="actor-tag actor-${n.actor}">${ACTOR_ICON[n.actor]} ${ACTOR_LABEL[n.actor]} 실행</span>`;
  let html = `<h4 style="color:${CAT_COLOR[n.cat]}">${esc(s.desc)}${atag}</h4><div class="why"><b>왜 중요한가</b> · ${esc(s.why)}</div>`;
  if (s.gate) html += `<div class="gate"><b>⏸ 사람 개입 지점</b> - ${esc(s.gate)}<br><button onclick="resumeGate()">진행 ▶</button></div>`;
  if (stepIdx === STEPS.length - 1) html += `<div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line)"><b>💡 핵심 요약</b> · ${KEY_INSIGHT}</div>`;
  d.innerHTML = html;
}

function render() {
  $('stepInfo').textContent = `${Math.max(stepIdx+1,0)} / ${STEPS.length}`;
  $('prev').disabled = stepIdx <= -1;
  $('next').disabled = stepIdx >= STEPS.length - 1;
  $('play').textContent = playing ? '❚❚ 정지' : (stepIdx >= STEPS.length - 1 ? '↺ 처음부터' : '▶ 재생');
  cy.$('.picked').removeClass('picked');
  if (stepIdx >= 0) {
    const act = STEPS[stepIdx].active;
    if (shownActive.length && shownActive[shownActive.length-1] !== act[0]) animateEdge(shownActive[shownActive.length-1], act[0]);
    else { cy.edges('.flow').removeClass('flow'); if (flowRAF) cancelAnimationFrame(flowRAF); }
    applySpotlight(act);
    focusNodes(act);
    showFiles(nodeById(act[0]).files);
    shownActive = act.slice();
  } else {
    cy.edges('.flow').removeClass('flow'); if (flowRAF) cancelAnimationFrame(flowRAF);
    if (haloRAF) cancelAnimationFrame(haloRAF);
    cy.nodes().removeClass('dim active'); cy.edges().removeClass('dim');
    cy.stop(); cy.zoom(INIT_ZOOM); cy.center(cy.$id('n1')); showFiles([]); shownActive = [];
  }
  renderCtx(); renderTree(); renderDetail();
}

function goto(i){ stepIdx = Math.max(-1, Math.min(STEPS.length-1, i)); render(); }

function startTimer(){
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    if (awaitingGate) return;                       // 게이트 대기 - 타이머는 살려둔다
    if (stepIdx >= STEPS.length - 1) { playing = false; clearInterval(timer); render(); return; }
    stepIdx++; render();
    if (STEPS[stepIdx].gate) awaitingGate = true;   // 게이트 도달 → 대기
  }, 1900);
}
window.resumeGate = () => {
  awaitingGate = false;
  if (!playing && stepIdx < STEPS.length-1) goto(stepIdx+1); // 수동 모드면 한 스텝 진행
};

$('play').onclick = () => {
  if (playing) { playing = false; if (timer) clearInterval(timer); render(); return; }
  if (stepIdx >= STEPS.length - 1) stepIdx = -1;
  playing = true; awaitingGate = false;
  if (stepIdx < 0) { stepIdx = 0; render(); if (STEPS[0].gate) awaitingGate = true; }
  startTimer();
};
$('prev').onclick = () => { playing=false; if(timer)clearInterval(timer); awaitingGate=false; goto(stepIdx-1); };
$('next').onclick = () => { playing=false; if(timer)clearInterval(timer); awaitingGate=false; goto(stepIdx+1); };
// 🔍 전체 보기 - 전체 그래프를 한 화면에. 이후 forward/rewind/play는 focusNodes가 cy.zoom()을
// 유지하므로 이 축소 배율 그대로 활성 노드만 패닝되어 따라간다(재생 중 배율 사용자 제어).
$('fit').onclick = () => {
  cy.stop();
  // 라벨(font-size 60)이 bbox를 부풀려 cy.fit이 과도하게 축소되므로, 노드 bbox(라벨 제외)에
  // 맞춰 줌/센터를 직접 계산한다 - 전체 흐름이 화면을 꽉 채우게.
  const bb = cy.nodes().boundingBox({ includeLabels:false });
  const pad = 70, w = cy.width(), h = cy.height();
  const z = Math.min((w - pad*2) / bb.w, (h - pad*2) / bb.h);
  cy.zoom(z); cy.center(cy.nodes());
};
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'){ e.preventDefault(); $('next').click(); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); $('prev').click(); }
});

// 노드 클릭 → 그 시점으로 점프 (재생 시작점)
function firstStepContaining(id){ for (let i=0;i<STEPS.length;i++) if (STEPS[i].active.includes(id)) return i; return -1; }
cy.on('tap','node', ev => {
  const id = ev.target.id(), i = firstStepContaining(id);
  playing=false; if(timer)clearInterval(timer); awaitingGate=false;
  if (i >= 0) { goto(i); }
  else { cy.$('.picked').removeClass('picked'); ev.target.addClass('picked'); showFiles(nodeById(id).files); }
});
cy.on('tap','edge', ev => {
  const tgt = ev.target.data('target'), i = firstStepContaining(tgt);
  if (i >= 0) { playing=false; if(timer)clearInterval(timer); awaitingGate=false; goto(i); }
});

function buildLegend() {
  const usedCats = [...new Set(NODES.map(n => n.cat))];
  let h = '<h5>색 = 단계 종류</h5>';
  usedCats.forEach(c => { h += `<div class="row"><span class="dot" style="background:${CAT_COLOR[c]}26;border-color:${CAT_COLOR[c]}"></span>${CATS[c]}</div>`; });
  h += '<h5>실행 주체</h5><div class="row">👤 사람이 실행/승인</div><div class="row">🤖 AI가 자동 수행</div>';
  h += '<h5>모양 · 엣지</h5><div class="row">◇ 판정/분기 · ⯃ 종료(공백)</div><div class="row"><span class="ln"></span>진행 → · 점선 = 지금 지나가는 경로</div>';
  $('legend').innerHTML = h;
}

buildLegend();
render();
window.addEventListener('resize', () => { if (stepIdx>=0) focusNodes(STEPS[stepIdx].active); });
</script>
</body>
</html>
