ill='#0F172A'><tspan x='1275' dy='0'>Skill</tspan></text><rect x='720' y='455' width='190' height='82' rx='18' fill='#DCFCE7' stroke='#16A34A' stroke-width='3'/><text x='815' y='504' text-anchor='middle' font-size='22' font-weight='700' fill='#0F172A'><tspan x='815' dy='0'>Subagent</tspan></text><rect x='950' y='455' width='190' height='82' rx='18' fill='#DCFCE7' stroke='#16A34A' stroke-width='3'/><text x='1045' y='504' text-anchor='middle' font-size='22' font-weight='700' fill='#0F172A'><tspan x='1045' dy='0'>Hook</tspan></text><rect x='1180' y='455' width='190' height='82' rx='18' fill='#DCFCE7' stroke='#16A34A' stroke-width='3'/><text x='1275' y='504' text-anchor='middle' font-size='22' font-weight='700' fill='#0F172A'><tspan x='1275' dy='0'>MCP</tspan></text><line x1='565' y1='455' x2='720' y2='455' stroke='#94A3B8' stroke-width='5' stroke-linecap='round' marker-end='url(#arrow)'/>
