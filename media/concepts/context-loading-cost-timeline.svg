text x='1095' y='383' text-anchor='middle' font-size='20' font-weight='700' fill='#0F172A'><tspan x='1095' dy='0'>Hook: 실행</tspan><tspan x='1095' dy='30'>시 / 0 또는</tspan><tspan x='1095' dy='30'>낮음</tspan></text><circle cx='1095' cy='560' r='10' fill='#7C3AED' opacity='0.78'/><text x='1095' y='630' text-anchor='middle' font-size='18' font-weight='700' fill='#475569'>토큰 비용</text><rect x='1215' y='330' width='170' height='150' rx='18' fill='#DBEAFE' stroke='#2563EB' stroke-width='3'/><text x='1300' y='383' text-anchor='middle' font-size='20' font-weight='700' fill='#0F172A'><tspan x='1300' dy='0'>MCP: 필요 시</tspan><tspan x='1300' dy='30'>스키마 / 서버</tspan><tspan x='1300' dy='30'>수 비례</tspan></text><circle cx='1300' cy='560' r='24' fill='#7C3AED' opacity='0.78'/><text x='1300' y='630' text-anchor='middle' font-size='18' font-weight='700' fill='#475569'>토큰 비용</text><line x1='190' y1='520' x2='1410' y2='520' stroke='#94A3B8' stroke-width='5' stroke-linecap='round' marker-end='url(#arrow)'/>
